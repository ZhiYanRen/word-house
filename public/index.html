<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23634e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" type="image/svg+xml" href="./assets/logo.svg"><link rel="alternate icon" type="image/png" href="./assets/favicon.png"><link rel="apple-touch-icon" href="./assets/apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest"><title>单词小屋 · 课本词库</title><style>
:root{--ink:#243e37;--green:#23634e;--paper:#fffdf6;--line:#d8ded0;--orange:#f4bc65}*{box-sizing:border-box;scrollbar-color:#8caa98 #f6f3e8}body{margin:0;color:var(--ink);background:#f6f3e8;font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1000px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:800;font-size:24px}.tag{font-size:13px;border:1px solid var(--line);border-radius:30px;padding:5px 13px}h1{font-size:clamp(32px,5vw,48px);line-height:1.2;margin:30px 0 12px;letter-spacing:-1px}p{margin:8px 0;color:#52665d}.intro{margin-bottom:26px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 18px;background:var(--paper);color:var(--ink);transition:background .15s}button:hover{background:#e8eedf}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:3px solid #bf7c25;outline-offset:3px}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:default}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 8px 0 #e8e7d9}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.word{padding:22px 10px;text-align:center}.emoji{display:block;font-size:34px}.english{display:block;font-family:Georgia,serif;font-size:27px;font-weight:bold}.chinese{font-size:16px;color:#52665d}.small{font-size:14px}.topline{display:flex;justify-content:space-between;gap:12px}.bar{height:7px;background:#e7ebdf;border-radius:10px;margin:16px 0 30px;overflow:hidden}.fill{height:100%;background:var(--green)}.exercise{text-align:center;max-width:560px;margin:auto}.prompt{font-size:42px;font-weight:800;margin:22px 0}.sound{font-size:23px;padding:20px 32px;background:#fce7bc;border-color:#e7bd77}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}input{display:block;width:100%;padding:16px;border:2px solid #a7b9a8;border-radius:13px;font:28px Georgia,serif;text-align:center;background:#fff;margin-top:10px;color:var(--ink)}label{display:block;margin-top:25px}#feedback{min-height:65px;padding:12px 0;font-weight:600}.good{color:#23634e}.wrong{color:#a43e2b}footer{font-size:13px;color:#64746b;margin:25px 0} .score{font:80px Georgia,serif;color:var(--green)}.review{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;text-align:left;gap:15px}.review span{overflow-wrap:anywhere}#audioStatus{min-height:24px;color:#8a421f;font-size:14px} @media(max-width:620px){main{padding:20px 16px}.grid{grid-template-columns:repeat(2,1fr)}.panel{padding:20px}.tag{font-size:11px}.tabs button{flex:1;padding:10px 8px;font-size:15px}.word{padding:18px 5px}}

:root{--scroll-thumb:#8caa98;--scroll-track:#f6f3e8;--scroll-hover:#638772;--scroll-active:#23634e;scrollbar-color:var(--scroll-thumb) var(--scroll-track);scrollbar-width:auto;color-scheme:light}
*{scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:var(--scroll-track)}::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border:3px solid var(--scroll-track);border-radius:12px}::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}::-webkit-scrollbar-thumb:active{background:var(--scroll-active)}
main{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}.brand{display:flex;align-items:center;gap:12px}header{gap:12px;flex-wrap:wrap}h1{font-size:24px;margin:20px 0 8px;letter-spacing:0}.intro{margin-bottom:12px}.tabs{position:sticky;top:0;z-index:1;background:#f6f3e8;padding:8px 0;margin:12px 0}button{min-height:44px;transition:background 160ms ease-out,transform 160ms ease-out}.english{overflow-wrap:anywhere}.word{min-width:0}.topline{flex-wrap:wrap}#answer{scroll-margin:100px}.panel{animation:arrive 180ms ease-out}@keyframes arrive{from{opacity:.7;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:620px){.tabs button{flex:1 1 calc(50% - 8px)}.panel{padding:18px}.english{font-size:clamp(19px,5.6vw,27px)}.brand{font-size:22px}.prompt{font-size:32px}}

</style></head><body><main><header><div class="brand"><img src="./assets/logo.svg" width="44" height="44" alt="">单词小屋</div><span class="tag">课本单词 · 听写与默写</span></header><div class="intro"><h1>课本单词练习</h1><p>127 个单词与短语，涵盖家居、颜色、数字、学校、水果、动物、运动等课本内容。</p></div><nav class="tabs" aria-label="练习方式"><button type="button" onclick="setMode(this.dataset.mode)" data-mode="learn">认一认</button><button type="button" onclick="setMode(this.dataset.mode)" data-mode="listen">听写练习</button><button type="button" onclick="setMode(this.dataset.mode)" data-mode="write">中文默写</button><button type="button" onclick="setMode(this.dataset.mode)" data-mode="wrong">错词再练 <span id="wrongCount">0</span></button></nav><section class="panel" id="app"></section><p id="audioStatus" role="status"></p><footer>小建议：先认一遍，再听写，最后看中文默写。听写时也可以先写在纸上，再输入答案检查。<br>发音使用设备的英语语音；听不到时，请检查音量或换用 Safari / Chrome。</footer></main>
<script>
const words=[["mirror","镜子","🪞"],["sofa","沙发","🛋️"],["phone","电话","☎️"],["lamp","灯","💡"],["mat","地毯","▧"],["clock","钟表","🕰️"],["bed","床","🛏️"],["bath","浴缸","🛁"],["grey","灰色","🩶"],["pink","粉色","🩷"],["green","绿色","🟢"],["orange","橙色；橙子","🟠"],["red","红色","🔴"],["brown","棕色","🟤"],["white","白色","⚪"],["blue","蓝色","🔵"],["yellow","黄色","🟡"],["purple","紫色","🟣"],["black","黑色","⚫"],["eleven","十一","11"],["twelve","十二","12"],["thirteen","十三","13"],["fourteen","十四","14"],["fifteen","十五","15"],["sixteen","十六","16"],["seventeen","十七","17"],["eighteen","十八","18"],["nineteen","十九","19"],["twenty","二十","20"],["board","黑板","▣"],["bookcase","书柜","📚"],["cupboard","橱柜","🗄️"],["desk","课桌","✏️"],["ruler","尺子","📏"],["teacher","老师","🧑‍🏫"],["banana","香蕉","🍌"],["apple","苹果","🍎"],["pear","梨","🍐"],["pineapple","菠萝","🍍"],["lemon","柠檬","🍋"],["alien","外星人","👽"],["camera","照相机","📷"],["computer game","电脑游戏","🎮"],["kite","风筝","🪁"],["lorry","卡车","🚚"],["robot","机器人","🤖"],["watch","手表","⌚"],["this","这个","☝️"],["bottle","瓶子（单数）","🧴"],["flowerpot","花盆","🪴"],["keyboard","键盘","⌨️"],["paper","纸","📄"],["plastic bag","塑料袋（单数）","🛍️"],["bottles","瓶子（复数）","🧴"],["plastic bags","塑料袋（复数）","🛍️"],["baby","婴儿","👶"],["cousin","堂兄弟姐妹；表兄弟姐妹","👧"],["mummy","妈妈","👩"],["daddy","爸爸","👨"],["grandma","奶奶；外婆","👵"],["grandpa","爷爷；外公","👴"],["bread","面包","🍞"],["chicken","鸡肉；鸡","🐔"],["chips","薯条","🍟"],["eggs","鸡蛋（复数）","🥚"],["juice","果汁","🧃"],["milk","牛奶","🥛"],["rice","米饭","🍚"],["water","水","💧"],["animals","动物（复数）","🐾"],["trees","树（复数）","🌳"],["plants","植物（复数）","🌱"],["cow","奶牛","🐄"],["duck","鸭子","🦆"],["frog","青蛙","🐸"],["goat","山羊","🐐"],["lizard","蜥蜴","🦎"],["sheep","绵羊","🐑"],["spider","蜘蛛","🕷️"],["café","咖啡馆","☕"],["flat","公寓","🏢"],["hospital","医院","🏥"],["park","公园","🌳"],["shop","商店","🏪"],["street","街道","🏘️"],["behind","在……后面","↩️"],["between","在……之间","↔️"],["in front of","在……前面","⬆️"],["next to","紧挨着；在……旁边","➡️"],["balloon","气球","🎈"],["bin","垃圾桶","🗑️"],["grass","草","🌿"],["road","道路","🛣️"],["rubbish","垃圾","🗑️"],["traffic lights","交通信号灯","🚦"],["dress","连衣裙","👗"],["glasses","眼镜","👓"],["handbag","手提包","👜"],["hat","帽子","👒"],["jeans","牛仔裤","👖"],["shirt","衬衫","👔"],["sunglasses","太阳镜","🕶️"],["wool","羊毛","🧶"],["paint","画画；涂色","🎨"],["play badminton","打羽毛球","🏸"],["play baseball","打棒球","⚾"],["play basketball","打篮球","🏀"],["play hockey","打曲棍球","🏑"],["play table tennis","打乒乓球","🏓"],["badminton","羽毛球","🏸"],["baseball","棒球","⚾"],["basketball","篮球","🏀"],["hockey","曲棍球","🏑"],["table tennis","乒乓球","🏓"],["bounce","弹跳；使球弹起","🏀"],["stick","棍；球棍","🏑"],["burger","汉堡包","🍔"],["cake","蛋糕","🍰"],["lemonade","柠檬饮料","🍋"],["sausage","香肠","🌭"],["watermelon","西瓜","🍉"],["beach","海滩","🏖️"],["mountain","山","⛰️"],["sand","沙子","🏖️"],["sea","海","🌊"],["shell","贝壳","🐚"],["sun","太阳","☀️"]];
const app=document.querySelector('#app');let mistakes=new Set();try{const saved=JSON.parse(localStorage.getItem('word-house-errors')||'[]');if(Array.isArray(saved))mistakes=new Set(saved.filter(w=>words.some(x=>x[0]===w)))}catch(e){}
let mode='learn',queue=[],index=0,results=[],checked=false;const synth=window.speechSynthesis;let voices=[];function loadVoices(){voices=synth?synth.getVoices():[]}loadVoices();if(synth)synth.addEventListener('voiceschanged',loadVoices);
function speak(word,slow=false){const status=document.querySelector('#audioStatus');status.textContent='';if(!synth){status.textContent='这个浏览器暂时不能发音，可以先练中文默写。';return} synth.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang='en-GB';utterance.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;utterance.rate=slow?.65:.85;utterance.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))status.textContent='发音未成功，请再点一次播放，或换用 Safari / Chrome。'};synth.speak(utterance)}
function save(){try{localStorage.setItem('word-house-errors',JSON.stringify([...mistakes]))}catch(e){document.querySelector('#audioStatus').textContent='当前浏览器无法保存错词，本次练习仍可继续。'}document.querySelector('#wrongCount').textContent=mistakes.size}
function shuffle(items){let a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setMode(next){if(synth)synth.cancel();mode=next;document.querySelector('#audioStatus').textContent='';document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode)});if(mode==='learn'){app.innerHTML='<div class="topline"><strong>认识这 '+words.length+' 个单词</strong><span class="small">点卡片听发音</span></div><div class="grid" style="margin-top:20px">'+words.map((w,i)=>`<button class="word" data-word="${i}" aria-label="播放 ${w[0]}"><span class="emoji" aria-hidden="true">${w[2]}</span><span class="english">${w[0]}</span><span class="chinese">${w[1]} ↗</span></button>`).join('')+'</div>';app.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>speak(words[+b.dataset.word][0]));return}queue=shuffle(mode==='wrong'?words.filter(w=>mistakes.has(w[0])):words);index=0;results=[];render()}
function render(){checked=false;if(!queue.length){app.innerHTML='<div class="exercise"><div class="prompt">还没有错词 🌱</div><p>先做一轮听写或默写，写错的单词会收在这里。</p><div class="controls"><button class="primary" id="start">开始听写</button></div></div>';document.querySelector('#start').onclick=()=>setMode('listen');return}if(index>=queue.length){finish();return}const w=queue[index],listening=mode==='listen';app.innerHTML=`<div class="topline"><strong>${listening?'听一听，写出来':mode==='wrong'?'再试一次，你可以的':'看中文，写英文'}</strong><span>${index+1} / ${queue.length}</span></div><div class="bar"><div class="fill" style="width:${index/queue.length*100}%"></div></div><div class="exercise">${listening?'<div class="controls"><button class="sound" id="play">▶ 播放单词</button><button id="slow">慢一点听</button></div><p class="small">可以重复播放，不显示中文提示。</p>':`<div class="prompt">${w[1]}</div>`}<form id="answerForm" novalidate><label for="answer">${listening?'听到的英文单词是？':'它的英文怎么拼？'}</label><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="feedback" placeholder="在这里输入单词"><div id="feedback" role="status" aria-live="polite"></div><div class="controls"><button class="primary" type="submit" id="submit">检查答案</button><button type="button" id="reveal">还不会，学一下</button></div></form></div>`;if(listening){document.querySelector('#play').onclick=()=>speak(w[0]);document.querySelector('#slow').onclick=()=>speak(w[0],true)}document.querySelector('#answerForm').onsubmit=e=>{e.preventDefault();if(e.isComposing)return;if(checked){index++;render()}else check(false)};document.querySelector('#reveal').onclick=()=>check(true);document.querySelector('#answer').focus()}
function check(reveal){if(checked)return;const input=document.querySelector('#answer');const value=input.value.trim().toLowerCase().normalize('NFC').replace(/\s+/g,' ');const f=document.querySelector('#feedback');if(!value&&!reveal){f.textContent='先写一个答案吧，或者点“还不会，学一下”。';input.focus();return}checked=true;const w=queue[index],correct=!reveal&&(value===w[0]||(w[0]==='café'&&value==='cafe'));results.push({word:w,correct,answer:input.value.trim()});if(correct)mistakes.delete(w[0]);else mistakes.add(w[0]);save();f.className=correct?'good':'wrong';f.textContent=correct?'✓ 写对啦！ '+w[0]+' · '+w[1]:'再记一遍：'+w[0]+' · '+w[1]+'（已收进错词）';input.readOnly=true;document.querySelector('#reveal').disabled=true;document.querySelector('#submit').textContent=index===queue.length-1?'查看本轮成绩':'下一个单词 →';document.querySelector('#submit').focus()}
function finish(){const right=results.filter(r=>r.correct).length;app.innerHTML=`<div class="exercise"><strong>这一轮练完啦！</strong><div class="score">${right}<span style="font-size:30px"> / ${queue.length}</span></div><p>${right===queue.length?'全部写对！可以换一种方式再挑战一次。':'每练一次，就多记住一点。再练练错词吧。'}</p><div id="review"></div><div class="controls"><button class="primary" id="again">再练一轮</button><button id="errors">练习错词（${mistakes.size}）</button></div><button id="other">${mode==='listen'?'试试中文默写':'试试听写'}</button></div>`;for(const r of results){const row=document.createElement('div');row.className='review';const a=document.createElement('span'),b=document.createElement('span');a.textContent=r.word[0]+' · '+r.word[1];b.textContent=r.correct?'✓ 正确':'你的答案：'+(r.answer||'未作答');b.className=r.correct?'good':'wrong';row.append(a,b);document.querySelector('#review').append(row)}document.querySelector('#again').onclick=()=>setMode(mode);document.querySelector('#errors').onclick=()=>setMode('wrong');document.querySelector('#other').onclick=()=>setMode(mode==='listen'?'write':'listen')}
setMode('learn');save();
</script></body></html>
